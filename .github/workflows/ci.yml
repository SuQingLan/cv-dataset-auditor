name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run tests
        run: |
          python -X utf8 -W error -m unittest discover -s tests -v

      - name: Generate demo dataset
        run: |
          python examples/generate_dataset.py demo_dataset

      - name: Run CLI audit (expect error exit code)
        run: |
          set +e
          cv-audit demo_dataset -c 3 -o audit-report --fail-on error
          code=$?
          set -e
          echo "Audit exit code (expected 1 due to intentional errors): $code"
          test $code -eq 1
          test -f audit-report/report.json
          test -f audit-report/report.html
          test -d audit-report/gallery

      - name: Verify report contents
        run: |
          python - <<'EOF'
          import json
          with open('audit-report/report.json', encoding='utf-8') as f:
              report = json.load(f)
          errors = report['summary']['errors']
          assert errors >= 4, report['summary']
          cats = {f['category'] for f in report['findings']}
          assert 'leakage' in cats, cats
          assert 'image' in cats, cats
          assert 'label' in cats, cats
          print('Audit report OK:', report['summary'])
          EOF

      - name: Run audit with --fail-on never (expect 0)
        run: |
          cv-audit demo_dataset -c 3 -o audit-report-never --fail-on never
          echo "Never-fail mode exit code: $?"